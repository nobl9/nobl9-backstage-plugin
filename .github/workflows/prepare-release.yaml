name: prepare-release
on: workflow_dispatch
jobs:
  prepare:
    name: Open a version bump pull request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The machine user opens the PR, so that CI runs on it
          # and a code owner other than the machine user can approve it.
          token: ${{ secrets.N9_MACHINE_USER_BACKSTAGE_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bump versions and changelogs
        run: |
          yarn install
          yarn release:prepare
          echo "version=$(node -p "require('./lerna.json').version")" >> "$GITHUB_ENV"

      - name: Open pull request
        run: |
          git config --global user.name "n9-machine-user"
          git config --global user.email "n9-machine-user@users.noreply.github.com"
          git checkout -b "release/v${version}"
          # Only the files lerna changed. yarn install may touch yarn.lock; that is not part of a release.
          git add lerna.json CHANGELOG.md 'plugins/*/package.json' 'plugins/*/CHANGELOG.md'
          git commit -m "chore: release v${version}"
          git push -u origin "release/v${version}"
          gh pr create \
            --base main \
            --title "chore: release v${version}" \
            --body "Version bump and changelog for v${version}, generated by the prepare-release workflow. After merging, run the release workflow to tag and publish."
        env:
          GH_TOKEN: ${{ secrets.N9_MACHINE_USER_BACKSTAGE_TOKEN }}
