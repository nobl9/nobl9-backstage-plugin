name: release
on: workflow_dispatch
jobs:
  publish:
    name: Create release and publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm trusted publishing (OIDC).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.N9_MACHINE_USER_BACKSTAGE_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing requires npm 11.5.1 or newer, which ships with Node 24.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Build and verify
        run: |
          yarn install
          yarn ci

      - name: Check that the version is not released yet
        run: |
          version="$(node -p "require('./lerna.json').version")"
          if git ls-remote --exit-code --tags origin "v${version}" >/dev/null; then
            echo "Tag v${version} already exists. Merge a version bump pull request first (prepare-release workflow)."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_ENV"

      - name: Create tag and GitHub release
        run: |
          git config --global user.name "n9-machine-user"
          git config --global user.email "n9-machine-user@users.noreply.github.com"
          git tag -a "v${version}" -m "v${version}"
          git push origin "v${version}"
          gh release create "v${version}" --title "v${version}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.N9_MACHINE_USER_BACKSTAGE_TOKEN }}

      - name: Publish packages
        run: npx lerna publish --yes from-package
